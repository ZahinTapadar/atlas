name: Release

# Push a tag like v1.0.0 to build ATLAS-1.0.0.dmg and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Import the release certificate
        env:
          P12: ${{ secrets.RELEASE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.RELEASE_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"; KCP=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$KCP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCP" "$KC"
          security import "$RUNNER_TEMP/release.p12" -k "$KC" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/release.p12"
          security find-identity -p codesigning "$KC"

      - name: Build disk image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ATLAS Release
        run: scripts/package-release.sh "${{ steps.v.outputs.version }}"

      - name: Verify release signature
        run: |
          codesign -v --deep --strict -R='identifier "com.atlas.tracker" and certificate root = H"7d3eed29018c8a73ae6f33dc246d854a65c46a9a"' build/ATLAS.app
          codesign -dr - build/ATLAS.app

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" "dist/ATLAS-$V.dmg" "dist/ATLAS-$V.dmg.sha256" dist/ATLAS.dmg \
            --title "ATLAS $V" --notes-file .github/release-notes.md --latest || \
          gh release upload "v$V" "dist/ATLAS-$V.dmg" "dist/ATLAS-$V.dmg.sha256" dist/ATLAS.dmg --clobber
