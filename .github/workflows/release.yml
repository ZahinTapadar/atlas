name: Release

# Push a tag like v1.0.0 to build ATLAS-1.0.0.dmg and publish it as a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the v)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build disk image
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/package-release.sh "${{ steps.v.outputs.version }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "v$V" "dist/ATLAS-$V.dmg" "dist/ATLAS-$V.dmg.sha256" dist/ATLAS.dmg \
            --title "ATLAS $V" --notes-file .github/release-notes.md --latest || \
          gh release upload "v$V" "dist/ATLAS-$V.dmg" "dist/ATLAS-$V.dmg.sha256" dist/ATLAS.dmg --clobber
